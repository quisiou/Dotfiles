# yazi/keymap.toml


[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd ~/.local/share"
desc = "Go to ~/.local/share (user)"

[[mgr.prepend_keymap]]
on   = [ "g", "t" ]
run  = "cd ~/.local/share/Trash/files"
desc = "Go to trash bin"

[[mgr.prepend_keymap]]
on   = "<C-x>"
run  = "plugin extract-to"
desc = "Extract archive to named folder"
